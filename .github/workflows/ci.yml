name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# NO concurrency BLOCK HERE, DELIBERATELY.
#
# One was added on 2026-10-05 with `cancel-in-progress: false`, on the theory that
# a second push had cancelled the Pages build. That theory was wrong. The
# annotation on the run says:
#
#   "The job was not acquired by Runner of type hosted even after multiple attempts"
#
# No runner was ever assigned, so nothing cancelled anything - the queue simply
# never started. The block would not have prevented that, and it sits in the wrong
# file besides: the Pages workflow is `dynamic/pages/pages-build-deployment`,
# generated by GitHub, not read from this repository.
#
# It is recorded here so the next person who reaches for a concurrency block finds
# the real cause first. If a real cancellation ever happens, add the block to the
# Pages workflow source, not to CI.

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - run: npm ci 2>/dev/null || true
    - run: npx htmlhint '**/*.html' 2>/dev/null || npx linkinator . --skip '^(?!http)' 2>/dev/null || echo "No HTML linter configured"
